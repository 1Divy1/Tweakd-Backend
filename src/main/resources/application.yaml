supabase:
  url: ${SUPABASE_URL}
  # Service-role key; used only by the admin module's SupabaseAuthAdminClient (staff invites).
  secret-key: ${SUPABASE_SECRET_KEY}
  auth:
    issuer: ${SUPABASE_URL}/auth/v1

mapbox:
  access-token: ${MAPBOX_ACCESS_TOKEN}

cloudflare:
  r2:
    account-id: ${CLOUDFLARE_ACCOUNT_ID}
    access-key: ${CLOUDFLARE_ACCESS_KEY_ID}
    secret-key: ${CLOUDFLARE_ACCESS_KEY_SECRET}
    presign-expiry-minutes: 15
    garage:
      bucket: ${CLOUDFLARE_GARAGE_BUCKET_NAME}
      public-url: ${CLOUDFLARE_GARAGE_BUCKET_URL}
    posts:
      bucket: ${CLOUDFLARE_POSTS_BUCKET_NAME}
      public-url: ${CLOUDFLARE_POSTS_BUCKET_URL}
    avatars:
      bucket: ${CLOUDFLARE_AVATARS_BUCKET_NAME}
      public-url: ${CLOUDFLARE_AVATARS_BUCKET_URL}
    business:
      bucket: ${CLOUDFLARE_BUSINESS_BUCKET_NAME}
      public-url: ${CLOUDFLARE_BUSINESS_BUCKET_URL}
    map-events:
      bucket: ${CLOUDFLARE_MAP_EVENTS_BUCKET_NAME}
      public-url: ${CLOUDFLARE_MAP_EVENTS_BUCKET_URL}
    assets:
      bucket: ${CLOUDFLARE_ASSETS_BUCKET_NAME}
      public-url: ${CLOUDFLARE_ASSETS_BUCKET_URL}

sharing:
  # Origin + path prefix that a car's share code is appended to, producing the URL printed on the
  # QR sticker and unfurled by WhatsApp/iMessage/X. Codes are stored bare, so pointing the feature
  # at a different domain (staging, a rename) is a config change and never a data migration.
  #
  # `web.` is a separate Cloudflare Worker (repo: Tweakd-Web-App) that renders the public car page;
  # the apex tweakdapp.com is the presentation site and knows nothing about share codes. The host
  # here must match the one the app claims for deep links (the iOS Associated Domains entitlement
  # and the Android intent filter) — a mismatch means links open a browser instead of the app.
  public-base-url: ${SHARING_PUBLIC_BASE_URL:https://web.tweakdapp.com/c}

firebase:
  # Push delivery for every notification type except `dm`, which a Supabase edge function owns.
  # Credentials come from Application Default Credentials: the Cloud Run runtime service account in
  # production, GOOGLE_APPLICATION_CREDENTIALS or `gcloud auth application-default login` locally.
  # If they cannot be resolved the backend still starts and simply does not push.
  enabled: ${FIREBASE_ENABLED:true}
  project-id: ${FIREBASE_PROJECT_ID:}
  android-channel-id: tweakd_default
  dry-run: ${FIREBASE_DRY_RUN:false}

reputation:
  # Paused by the owner (2026-09-18): the score is hidden in the app, and while this is false no
  # award or revocation moves it — contest podiums still get their badges, just no points. Flip to
  # true (REPUTATION_ENABLED=true on Cloud Run, no rebuild) to switch awarding back on. See
  # reputation/README.md, "Paused".
  enabled: ${REPUTATION_ENABLED:false}

origin-guard:
  # Shared secret that Cloudflare adds to every request for api.tweakdapp.com as the
  # X-Origin-Secret header (a request header Transform Rule). Requests without it get 403, which is
  # what stops callers from skipping Cloudflare by using the *.run.app URL directly.
  # Unset = guard off: local runs, tests, and the rollout window before every client has moved to
  # api.tweakdapp.com. Set it on Cloud Run only once they have. See shared/README.md.
  secret: ${ORIGIN_SECRET:}

rate-limit:
  # ENFORCE: over-limit requests get 429 + Retry-After. The Flutter app handles that (it shows a
  # "slow down" notice and never retries), so enforcement is on from day one rather than tuned from
  # LOG_ONLY logs first — every limit below is set with enough headroom that a real user cannot
  # reach it.
  #
  # Override with the RATE_LIMIT_MODE env var, no rebuild needed:
  #   OFF       kill switch, and what to use for load-test runs (the limiter would reject most of a
  #             load test, making the results meaningless). Local .env sets this.
  #   LOG_ONLY  counts and logs what it would block, blocks nothing. Useful if a limit is suspected
  #             of being too tight and you want evidence before loosening it.
  # See RATE_LIMITING_PROGRESS.md.
  mode: ${RATE_LIMIT_MODE:ENFORCE}
  #
  # Every limit has a default in shared/ratelimit/RateLimitProperties — deliberately, so tests and
  # local runs behave like production. Override only what needs tuning, e.g.
  #
  #   limits:
  #     comments:
  #       capacity: 20
  #       refill-tokens: 1
  #       refill-period: 10s
  #
  # Defaults, as "burst, then sustained rate":
  #   general               240, then 240/min   every authenticated request (app launch is ~5 calls;
  #                                             a busy human minute is well under 100)
  #   public.backstop       600, then 600/min   per IP on /public/** (real visitors come via the
  #                                             web.tweakdapp.com Worker, so these IPs are usually
  #                                             Cloudflare's — per-visitor limiting belongs there)
  #   posts.create            5, then 1/2min    composing a post is minutes of work
  #   forums.thread           5, then 1/2min
  #   comments               15, then 1/6s      typing a reply takes longer than 6s
  #   reactions              60, then 1/1s      likes/saves/shares/votes/follows (notification spam)
  #   reports                10, then 1/2min    room to report a whole spam wave
  #   feedback.create         5, then 1/5min
  #   mapevents.create        5, then 1/20min   an organizer setting up several meets in one sitting
  #   mapevents.participate  20, then 1/15s
  #   garage.write           30, then 1/5s      a car plus a dozen modifications in one session
  #   uploads                40, then 1/5s      presigned R2 upload URLs; one call = up to 10 images
  #   devices                30, then 1/min     runs on every app start/sign-in, not on user intent

spring:
  application:
    name: backend

  jackson:
    property-naming-strategy: SNAKE_CASE

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_USER}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 5000

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${supabase.auth.issuer}

  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true