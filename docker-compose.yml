services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: car-social-media-backend:latest
    container_name: car-social-media-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
