services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: tweakd-backend:latest
    container_name: tweakd-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
